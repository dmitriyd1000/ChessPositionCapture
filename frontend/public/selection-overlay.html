<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selection Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      background: rgba(0, 0, 0, 0.3);
      overflow: hidden;
      user-select: none;
    }
    #selection-box {
      position: absolute;
      border: 2px dashed #FF6B6B;
      background: rgba(255, 107, 107, 0.1);
      pointer-events: none;
      display: none;
    }
    #instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="instructions">Click and drag to select an area • Press ESC to cancel</div>
  <div id="selection-box"></div>
  <script>
    let startX, startY, isMouseDown = false;
    const selectionBox = document.getElementById('selection-box');
    const instructions = document.getElementById('instructions');

    document.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      startX = e.clientX;
      startY = e.clientY;
      selectionBox.style.display = 'none';
      instructions.style.display = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;

      const x = Math.min(startX, e.clientX);
      const y = Math.min(startY, e.clientY);
      const width = Math.abs(e.clientX - startX);
      const height = Math.abs(e.clientY - startY);

      selectionBox.style.left = x + 'px';
      selectionBox.style.top = y + 'px';
      selectionBox.style.width = width + 'px';
      selectionBox.style.height = height + 'px';
      selectionBox.style.display = 'block';
    });

    document.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;

      const x = Math.min(startX, e.clientX);
      const y = Math.min(startY, e.clientY);
      const width = Math.abs(e.clientX - startX);
      const height = Math.abs(e.clientY - startY);

      // Only send selection if there's a meaningful area selected
      if (width > 10 && height > 10) {
        window.electron.ipcRenderer.send('selection-complete', { x, y, width, height });
      } else {
        window.electron.ipcRenderer.send('selection-cancelled');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electron.ipcRenderer.send('selection-cancelled');
      }
    });
  </script>
</body>
</html>
