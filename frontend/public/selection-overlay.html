<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selection Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: rgba(255, 107, 107, 0.1);
      overflow: hidden;
      user-select: none;
      cursor: crosshair;
    }
    .frame { 
      position: absolute; 
      inset: 8px; 
      border: 2px dashed #FF6B6B; 
      pointer-events: none; 
      background: rgba(255, 255, 255, 0.05);
    }
    .instructions { 
      position: fixed; 
      bottom: 16px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.7); 
      color: #fff; 
      padding: 12px 20px; 
      border-radius: 6px; 
      font-family: Arial, sans-serif; 
      font-size: 14px; 
      text-align: center;
      z-index: 1000;
    }
    .instructions strong { display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="instructions">
    <strong>Resize window to select area</strong>
    <div>Double-click anywhere to capture • Press Esc to cancel</div>
  </div>
  <script>
    // Double-click to capture
    document.addEventListener('dblclick', (e) => {
      window.electron.ipcRenderer.send('selection-complete-by-window');
    });

    // ESC to cancel
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electron.ipcRenderer.send('selection-cancelled');
      }
    });
  </script>
</body>
</html>
